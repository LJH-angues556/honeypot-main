<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>phpMyAdmin</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", Arial, sans-serif; background:#f2f2f2; color:#222; font-size:13px; }
  .pma-header { background:#f37e1f; color:#fff; padding:10px 20px; font-size:18px; font-weight:bold; }
  .wrap { max-width: 460px; margin: 60px auto; background:#fff; border:1px solid #ccc; border-radius:4px; }
  .wrap h2 { margin:0; padding:10px 16px; background:linear-gradient(#fff,#f5f5f5); border-bottom:1px solid #ddd; font-size:14px; }
  .body { padding:20px 24px; }
  .row { margin-bottom:14px; }
  label { display:inline-block; width:110px; text-align:right; padding-right:10px; vertical-align:middle; }
  input[type=text], input[type=password] { width:230px; padding:6px 8px; border:1px solid #aaa; border-radius:2px; }
  .err { background:#fae58f; border:1px solid #d4b83a; padding:8px 12px; margin-bottom:16px; border-radius:2px; }
  .btn { background:linear-gradient(#fff,#e6e6e6); border:1px solid #999; border-radius:3px; padding:6px 18px; cursor:pointer; }
  .footer { text-align:center; color:#999; margin-top:24px; font-size:11px; }
</style>
</head>
<body>
  <div class="pma-header">phpMyAdmin</div>
  <div class="wrap">
    <h2>欢迎使用 phpMyAdmin</h2>
    <div class="body">
      {% if login_error %}
      <div class="err">#1045 - 无法登录：用户名或密码错误。</div>
      {% endif %}
      <form method="post" action="{{ login_path }}" autocomplete="off">
        <div class="row">
          <label>用户名：</label>
          <input type="text" name="pma_username" autofocus>
        </div>
        <div class="row">
          <label>密码：</label>
          <input type="password" name="pma_password">
        </div>
        <div class="row">
          <label></label>
          <button class="btn" type="submit">执行</button>
        </div>
      </form>
    </div>
  </div>
  <div class="footer">phpMyAdmin 4.9.11 · MySQL 8.0</div>
</body>
</html>
