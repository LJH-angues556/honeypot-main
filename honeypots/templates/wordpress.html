<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>WordPress 站点 › 登录</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#f0f0f1; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#3c434a; }
  .login { width:320px; margin:0 auto; padding: 80px 0 0; }
  .logo { text-align:center; margin-bottom:24px; font-size:30px; font-weight:bold; color:#3c434a; text-decoration:none; }
  .card { background:#fff; border:1px solid #c3c4c7; border-radius:8px; padding:26px 24px; }
  .card label { font-size:14px; }
  .card input { width:100%; margin:6px 0 16px; padding:8px 10px; border:1px solid #8c8f94; border-radius:4px; font-size:16px; }
  .err { background:#fcf0f1; border-left:4px solid #d63638; padding:10px 12px; margin-bottom:16px; font-size:13px; }
  .submit { background:#2271b1; color:#fff; border:none; border-radius:4px; width:100%; padding:9px; font-size:14px; cursor:pointer; }
  .submit:hover { background:#135e96; }
  .foot { text-align:center; margin-top:18px; font-size:12px; color:#50575e; }
  .foot a { color:#50575e; text-decoration:none; }
</style>
</head>
<body class="login">
  <div class="login">
    <div class="logo">● WordPress</div>
    <form class="card" method="post" action="{{ login_path }}">
      {% if login_error %}
      <div class="err">错误：用户名或密码不正确。<a href="#">忘记密码？</a></div>
      {% endif %}
      <label for="user_login">用户名或电子邮箱地址</label>
      <input type="text" name="log" id="user_login" autocomplete="username">
      <label for="user_pass">密码</label>
      <input type="password" name="pwd" id="user_pass" autocomplete="current-password">
      <button class="submit" type="submit">登录</button>
    </form>
    <p class="foot"><a href="#">返回 WordPress 站点</a> · Powered by WordPress 6.4</p>
  </div>
</body>
</html>
