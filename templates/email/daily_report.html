{% extends 'email/base.html' %}
{% block content %}
<h2 style="margin:0 0 16px;">每日攻击报告 · {{ day }}</h2>

<table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
  <tr>
    <td style="background:#eff6ff;border-radius:8px;padding:16px;text-align:center;width:50%;">
      <div style="font-size:26px;font-weight:700;color:#2563eb;">{{ events }}</div>
      <div style="color:#6b7280;font-size:13px;">攻击事件</div>
    </td>
    <td style="width:12px;"></td>
    <td style="background:#fef2f2;border-radius:8px;padding:16px;text-align:center;width:50%;">
      <div style="font-size:26px;font-weight:700;color:#dc2626;">{{ new_attackers }}</div>
      <div style="color:#6b7280;font-size:13px;">新增攻击者</div>
    </td>
  </tr>
</table>

<h3 style="margin:0 0 10px;font-size:15px;">Top 攻击来源 IP</h3>
{% if top_ips %}
<table width="100%" cellpadding="8" cellspacing="0" style="border-collapse:collapse;font-size:13px;">
  <tr style="background:#f3f4f6;text-align:left;">
    <th style="padding:8px;border:1px solid #e5e7eb;">排名</th>
    <th style="padding:8px;border:1px solid #e5e7eb;">IP 地址</th>
    <th style="padding:8px;border:1px solid #e5e7eb;">攻击次数</th>
  </tr>
  {% for ip, count in top_ips %}
  <tr>
    <td style="padding:8px;border:1px solid #e5e7eb;">{{ loop.index }}</td>
    <td style="padding:8px;border:1px solid #e5e7eb;">{{ ip }}</td>
    <td style="padding:8px;border:1px solid #e5e7eb;">{{ count }}</td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p style="color:#6b7280;">当日无攻击记录。</p>
{% endif %}
{% endblock %}
