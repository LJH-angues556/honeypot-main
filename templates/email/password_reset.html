{% extends 'email/base.html' %}
{% block content %}
<h2 style="margin:0 0 16px;">密码重置</h2>
<p>{{ user.username }}，您好：</p>
<p>我们收到了您的蜜罐管理系统密码重置请求，请点击下方按钮设置新密码：</p>

<p style="text-align:center;margin:28px 0;">
    <a href="{{ reset_url }}"
       style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;
              padding:12px 32px;border-radius:8px;font-weight:600;">重置密码</a>
</p>

<p style="color:#6b7280;font-size:13px;">或复制以下链接到浏览器打开：<br>
<a href="{{ reset_url }}" style="word-break:break-all;color:#2563eb;">{{ reset_url }}</a></p>

<p style="color:#dc2626;font-size:13px;">该链接 1 小时内有效，使用一次后立即失效。如非本人操作，请忽略此邮件并尽快修改密码。</p>
{% endblock %}
