<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:0;background:#eef1f6;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f6;padding:24px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;max-width:600px;width:100%;">
          <tr>
            <td style="background:#2563eb;padding:20px 28px;">
              <span style="color:#ffffff;font-size:18px;font-weight:700;">🐝 蜜罐安全系统</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;color:#1f2937;font-size:14px;line-height:1.7;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#f8fafc;border-top:1px solid #e5e7eb;color:#94a3b8;font-size:12px;">
              本邮件由蜜罐系统自动发送，请勿直接回复。
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
