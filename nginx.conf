# honeypot 蜜罐系统 Nginx 反向代理配置
# 作为完整配置挂载到容器 /etc/nginx/nginx.conf
worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 静态资源与上报内容体积都很小,10m 足够
    client_max_body_size 10m;

    upstream flask_upstream {
        server app:5000;
    }

    server {
        listen 80;
        server_name _;

        # 静态资源由 Nginx 直接提供(容器内挂载项目 static 目录)
        location /static/ {
            alias /var/www/static/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # SSE 实时事件流:关闭缓冲、长连接超时拉长(任务4.1)
        location /admin/stream {
            proxy_pass http://flask_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://flask_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }
}
